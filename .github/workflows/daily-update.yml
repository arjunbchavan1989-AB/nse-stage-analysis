name: Daily Update Stage Analysis Dashboard

on:
  schedule:
    # 19:30 IST = 14:00 UTC. Downstream dashboards wait for this batch.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:  # allow manual run
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - 'web/**'
      - '.github/workflows/daily-update.yml'

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          pip install --quiet -r pipeline/requirements.txt

      - name: Run pipeline (fetch + classify)
        run: |
          set -euo pipefail
          export REFRESH_NOT_BEFORE="$(date -u '+%Y-%m-%dT14:00:00+00:00')"
          cd pipeline
          python -m unittest discover -s ../tests -v
          python run.py 2>&1 | tee /tmp/pipeline.log
          if [ ! -f data/latest.json ]; then
            echo "Pipeline failed — no latest.json produced"
            exit 1
          fi

      - name: Copy data to web dashboard
        run: |
          mkdir -p web/data
          cp pipeline/data/latest.json web/data/latest.json
          mkdir -p web/data/history
          cp pipeline/data/latest.json "web/data/history/latest_$(date -u '+%Y-%m-%d').json"

      - name: Commit updated data to main
        run: |
          git config user.name "stage-analysis-bot"
          git config user.email "actions@github.com"
          git add web/data/latest.json web/data/history/ pipeline/data/snapshots/ 2>/dev/null || true
          git add pipeline/data/benchmark_midsmall400.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update stage analysis data $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
